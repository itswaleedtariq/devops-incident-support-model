# ============================================================
# Alembic Configuration
# DevOps Incident Support Model
# ============================================================
#
# This file is read by ``alembic`` commands.
# The ``sqlalchemy.url`` is intentionally left empty; it is
# set programmatically from application settings in ``env.py``.
#
# Usage:
#   alembic current          — Show current revision
#   alembic upgrade head     — Apply all pending migrations
#   alembic downgrade -1     — Revert the last migration
#   alembic revision --autogenerate -m "description"  — Generate migration
#
# Run from the backend/ directory.
# ============================================================

[alembic]
# Path to migration scripts (relative to this file / cwd = backend/)
script_location = alembic

# Template used when generating new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the timestamp in migration filenames
timezone = UTC

# Truncate the revision slug to this many characters
truncate_slug_length = 40

# Set to 'true' to run the environment on startup even without migrations
prepend_sys_path = .

# Connection URL — overridden dynamically in env.py from application settings.
# Leave this as a placeholder; do NOT hard-code credentials here.
sqlalchemy.url =

# ============================================================
# Logging
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
